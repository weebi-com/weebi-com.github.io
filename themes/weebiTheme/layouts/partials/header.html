<nav class="navbar navbar-expand-xl bg-body-white">
  <div class="container py-2">
    <a class="navbar-brand" href="/">
      <img src="/images/Weebi_Logo_Full.png" alt="Weebi" width="130" height="35">
    </a>
    <div class="d-flex align-items-center gap-2 ms-auto d-xl-none">
      <button type="button" class="topbar-icon topbar-icon-mail js-mail" data-track="email_click" aria-label="{{ T "contact_email" }}">
        <i class="bi bi-envelope"></i>
      </button>
      <a class="topbar-icon" target="_blank" rel="noopener" data-track="whatsapp_click" href="{{ site.Params.contact.whatsapp }}" aria-label="{{ T "contact_whatsapp" }}">
        <i class="bi bi-whatsapp"></i>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-xl-0 align-items-center">
        <li class="nav-item">
          <a class="nav-link" href="/{{ .Site.Language.Lang }}/#demo">{{ T "videos" }}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/{{ .Site.Language.Lang }}/prix/">{{ T "price" }}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/{{ .Site.Language.Lang }}/user-guide/">{{ T "faq" }}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/{{ .Site.Language.Lang }}/posts/">{{ T "blog" }}</a>
        </li>
      </ul>
      <div class="topbar-actions">
        <button type="button" class="topbar-icon topbar-icon-mail js-mail d-none d-xl-inline-flex" data-track="email_click" aria-label="{{ T "contact_email" }}">
          <i class="bi bi-envelope"></i>
        </button>
        <a class="topbar-icon d-none d-xl-inline-flex" target="_blank" rel="noopener" data-track="whatsapp_click" href="{{ site.Params.contact.whatsapp }}" aria-label="{{ T "contact_whatsapp" }}">

        <select class="form-select topbar-lang" onchange="window.location.href=this.value;" name="languages" aria-label="{{ T "language" }}">

            <option value="/{{ .Lang }}/"{{ if eq $.Site.Language.Lang .Lang }} selected{{ end }}>{{ .LanguageName }}</option>

        </select>
      </div>
