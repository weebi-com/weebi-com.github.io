# Build and deploy the Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.139.4
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          hugo version
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          # Build into ./public so we never wipe the tracked ./docs tree mid-deploy.
          # Prefer the Pages base URL when available; always fall back to the custom domain.
          BASE_URL="${{ steps.pages.outputs.base_url }}"
          if [ -z "${BASE_URL}" ] || [ "${BASE_URL}" = "/" ]; then
            BASE_URL="https://www.weebi.com"
          fi
          echo "Using baseURL=${BASE_URL}/"
          hugo \
            --destination public \
            --cleanDestinationDir \
            --minify \
            --baseURL "${BASE_URL}/"
      - name: Verify publish output
        run: |
          set -euo pipefail
          echo "Publish tree (top level):"
          ls -la public
          echo "File count: $(find public -type f | wc -l)"
          test -f public/fr/index.html
          test -f public/css/bootstrap.min.css
          test -f public/js/bootstrap.bundle.min.js
          FR_SIZE=$(wc -c < public/fr/index.html)
          echo "public/fr/index.html size=${FR_SIZE}"
          if [ "${FR_SIZE}" -lt 1000 ]; then
            echo "::error::French homepage is too small (${FR_SIZE} bytes) — refusing to deploy a broken site"
            exit 1
          fi
          # GitHub Pages custom domain + non-Jekyll static hosting
          cp CNAME public/CNAME
          touch public/.nojekyll
          # Root 404 for GitHub Pages (multilingual builds keep 404s under /fr/, /en/, …)
          if [ -f public/fr/404.html ]; then
            cp public/fr/404.html public/404.html
          elif [ -f public/404.html ]; then
            echo "Root 404.html already present"
          else
            echo "::warning::No 404.html generated; GitHub soft-404 CSP page will be used for missing URLs"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
