# Build and deploy the Hugo site to GitHub Pages
#
# REQUIRED Pages setting (or /fr/ will 404 while /docs/fr/ works):
#   Settings → Pages → Build and deployment → Source = "GitHub Actions"
# Do NOT use "Deploy from a branch" with folder "/" (repo root): that publishes
# the git tree and nests the real site under /docs/.
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with a modern Hugo; 0.146+ layout system is used by the theme.
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          hugo version
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          # Build into ./public so we never wipe the tracked ./docs tree mid-deploy.
          BASE_URL="${{ steps.pages.outputs.base_url }}"
          if [ -z "${BASE_URL}" ] || [ "${BASE_URL}" = "/" ]; then
            BASE_URL="https://www.weebi.com"
          fi
          echo "Using baseURL=${BASE_URL}/"
          hugo \
            --destination public \
            --cleanDestinationDir \
            --minify \
            --baseURL "${BASE_URL}/"
      - name: Prepare Pages files
        run: |
          set -euo pipefail
          cp CNAME public/CNAME
          touch public/.nojekyll
          if [ -f public/fr/404.html ]; then
            cp public/fr/404.html public/404.html
          elif [ -f public/404.html ]; then
            echo "Root 404.html already present"
          else
            echo "::error::No 404.html generated"
            exit 1
          fi
      - name: Verify publish output
        run: bash scripts/ci/verify-hugo-public.sh public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke test live site
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for CDN then smoke-test www.weebi.com
        run: bash scripts/ci/smoke-test-live.sh https://www.weebi.com
